    <!-- Google Fonts: Plus Jakarta Sans (Display & UI) + JetBrains Mono (Timecodes & BPM) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-first-paint theme script: prevents any flash between Light / Dark / System -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('lowervibe_theme_mode_v3') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          var metaTheme = document.getElementById('lv-theme-color');
          if (resolved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
            if (metaTheme) metaTheme.setAttribute('content', '#F4F6F2');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#0A0B0A');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <style>
      html.dark, html.dark body { background-color: #0A0B0A; color: #F4F5F3; }
      html.light, html.light body { background-color: #F4F6F2; color: #0B0D0B; }
      #lv-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0A0B0A;
        color: #F4F5F3;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 280ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      html.light #lv-boot-splash {
        background: #F4F6F2;
        color: #0B0D0B;
      }
      #lv-boot-splash.lv-boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      .lv-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      .lv-boot-emblem {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 24px;
        background: #0A0B0A;
        border: 1px solid rgba(198, 255, 61, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.36);
      }
      .lv-boot-ring {
        position: absolute;
        inset: -7px;
        border-radius: 28px;
        border: 1.5px solid rgba(198, 255, 61, 0.28);
        animation: lv-ring-pulse 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .lv-boot-bar {
        width: 6px;
        border-radius: 9999px;
        transform-origin: center;
      }
      .lv-boot-bar-1 { height: 22px; background: #7C5CFF; animation: lv-wave 0.72s ease-in-out infinite 0ms; }
      .lv-boot-bar-2 { height: 34px; background: #A5BE78; animation: lv-wave 0.64s ease-in-out infinite 110ms; }
      .lv-boot-bar-3 { height: 46px; background: #C6FF3D; animation: lv-wave 0.78s ease-in-out infinite 200ms; }
      .lv-boot-bar-4 { height: 32px; background: #C6FF3D; animation: lv-wave 0.68s ease-in-out infinite 90ms; }
      .lv-boot-bar-5 { height: 20px; background: #7C5CFF; animation: lv-wave 0.74s ease-in-out infinite 160ms; }
      .lv-boot-wordmark {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.14em;
        line-height: 1.1;
      }
      .lv-boot-sub {
        font-size: 12px;
        opacity: 0.68;
        margin-top: 2px;
      }
      .lv-boot-track {
        width: 152px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(128, 134, 128, 0.22);
        overflow: hidden;
      }
      .lv-boot-progress {
        width: 48%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #7C5CFF, #C6FF3D);
        animation: lv-slide-bar 1.1s ease-in-out infinite;
      }
      @keyframes lv-wave {
        0%, 100% { transform: scaleY(0.45); opacity: 0.72; }
        50% { transform: scaleY(1.06); opacity: 1; }
      }
      @keyframes lv-ring-pulse {
        0% { transform: scale(0.95); opacity: 0.7; }
        70% { transform: scale(1.08); opacity: 0; }
        100% { transform: scale(1.08); opacity: 0; }
      }
      @keyframes lv-slide-bar {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(230%); }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-[var(--accent)]/30 selection:text-[var(--text)]">
    <div id="lv-boot-splash" aria-hidden="true">
      <div class="lv-boot-card">
        <div class="lv-boot-emblem">
          <span class="lv-boot-ring"></span>
          <span class="lv-boot-bar lv-boot-bar-1"></span>
          <span class="lv-boot-bar lv-boot-bar-2"></span>
          <span class="lv-boot-bar lv-boot-bar-3"></span>
          <span class="lv-boot-bar lv-boot-bar-4"></span>
          <span class="lv-boot-bar lv-boot-bar-5"></span>
        </div>
        <div>
          <div class="lv-boot-wordmark">LOWERVIBE</div>
          <div class="lv-boot-sub">Independent African Music</div>
        </div>
        <div class="lv-boot-track">
          <div class="lv-boot-progress"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
