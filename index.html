    <!-- Pre-first-paint theme script: prevents any flash between Light / Dark / System -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('lowervibe_theme_mode_v3') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          var metaTheme = document.getElementById('lv-theme-color');
          if (resolved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
            if (metaTheme) metaTheme.setAttribute('content', '#F4F6F2');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#0A0B0A');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <style>
      html.dark, html.dark body { background-color: #0A0B0A; color: #F4F5F3; }
      html.light, html.light body { background-color: #F4F6F2; color: #0B0D0B; }
      #lv-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 42%, rgba(124, 92, 255, 0.14) 0%, rgba(198, 255, 61, 0.05) 30%, transparent 62%),
          #0A0B0A;
        color: #F4F5F3;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1), transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      html.light #lv-boot-splash {
        background:
          radial-gradient(circle at 50% 42%, rgba(124, 92, 255, 0.08) 0%, rgba(198, 255, 61, 0.08) 30%, transparent 62%),
          #F4F6F2;
        color: #0B0D0B;
      }
      #lv-boot-splash.lv-boot-hide {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .lv-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
        animation: lv-splash-enter 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .lv-boot-logo-stage {
        position: relative;
        width: 108px;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lv-boot-halo {
        position: absolute;
        inset: -10px;
        border-radius: 34px;
        background: radial-gradient(circle, rgba(124, 92, 255, 0.28) 0%, rgba(198, 255, 61, 0.14) 48%, transparent 72%);
        animation: lv-halo-breathe 2.2s ease-in-out infinite;
        pointer-events: none;
      }
      .lv-boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        border: 1.5px solid rgba(198, 255, 61, 0.36);
        animation: lv-ring-pulse 1.9s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        pointer-events: none;
      }
      .lv-boot-ring-2 {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        border: 1px solid rgba(124, 92, 255, 0.42);
        animation: lv-ring-pulse 1.9s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.7s;
        pointer-events: none;
      }
      .lv-boot-emblem {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: #0A0B0A;
        border: 1px solid rgba(198, 255, 61, 0.34);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 20px 44px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .lv-boot-svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .lv-boot-svg-ring {
        transform-origin: 96px 96px;
        animation: lv-svg-ring-breathe 2.2s ease-in-out infinite;
      }
      .lv-boot-svg-bar {
        transform-box: fill-box;
        transform-origin: center;
      }
      .lv-boot-svg-bar-1 { animation: lv-wave 0.84s ease-in-out infinite 0ms; }
      .lv-boot-svg-bar-2 { animation: lv-wave 0.72s ease-in-out infinite 120ms; }
      .lv-boot-svg-bar-3 { animation: lv-wave 0.90s ease-in-out infinite 220ms; }
      .lv-boot-svg-bar-4 { animation: lv-wave 0.76s ease-in-out infinite 100ms; }
      .lv-boot-svg-bar-5 { animation: lv-wave 0.86s ease-in-out infinite 180ms; }
      .lv-boot-wordmark {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 0.18em;
        line-height: 1.1;
        padding-left: 0.18em;
      }
      .lv-boot-sub {
        font-size: 12px;
        font-weight: 500;
        opacity: 0.68;
        margin-top: 5px;
      }
      .lv-boot-track {
        width: 144px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(128, 134, 128, 0.22);
        overflow: hidden;
      }
      .lv-boot-progress {
        width: 46%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #7C5CFF, #C6FF3D);
        animation: lv-slide-bar 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes lv-splash-enter {
        from { opacity: 0; transform: translate3d(0, 10px, 0) scale(0.96); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes lv-halo-breathe {
        0%, 100% { opacity: 0.65; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes lv-svg-ring-breathe {
        0%, 100% { opacity: 0.34; transform: scale(0.97); }
        50% { opacity: 0.68; transform: scale(1.03); }
      }
      @keyframes lv-wave {
        0%, 100% { transform: scaleY(0.56); opacity: 0.78; }
        50% { transform: scaleY(1.08); opacity: 1; }
      }
      @keyframes lv-ring-pulse {
        0% { transform: scale(0.84); opacity: 0.65; }
        75% { transform: scale(1.2); opacity: 0; }
        100% { transform: scale(1.2); opacity: 0; }
      }
      @keyframes lv-slide-bar {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(245%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .lv-boot-card,
        .lv-boot-halo,
        .lv-boot-ring,
        .lv-boot-ring-2,
        .lv-boot-svg-ring,
        .lv-boot-svg-bar,
        .lv-boot-progress {
          animation: none !important;
        }
        .lv-boot-ring,
        .lv-boot-ring-2 {
          opacity: 0.25;
        }
        .lv-boot-progress {
          width: 100%;
          opacity: 0.75;
        }
      }
    </style>
  </head>
