    <!-- PWA Web App Manifest & Mobile Integration -->

    <!-- OpenGraph / Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOWERVIBE" />
    <meta property="og:title" content="LOWERVIBE — Stream Trending African Independent Music" />
    <meta
      property="og:description"
      content="Stream trending independent music from Malawi, Nigeria, South Africa, and across Africa. Discover rising artists, save songs offline, and support creators directly."
    />
    <meta property="og:url" content="https://lowervibemusic.web.app/" />
    <meta property="og:image" content="https://lowervibemusic.web.app/icons/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="Stream trending independent music from Malawi, Nigeria, South Africa, and across Africa. Discover rising artists and save tracks offline."
    />
    <meta name="twitter:image" content="https://lowervibemusic.web.app/icons/pwa-512x512.png" />
    <script id="lv-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "LOWERVIBE",
            "alternateName": "LOWERVIBE Music",
            "url": "https://lowervibemusic.web.app/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://lowervibemusic.web.app/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "name": "LOWERVIBE",
            "url": "https://lowervibemusic.web.app/",
            "logo": "https://lowervibemusic.web.app/icons/pwa-512x512.png"
          },
          {
            "@type": "WebApplication",
            "name": "LOWERVIBE",
            "applicationCategory": "MusicApplication",
            "operatingSystem": "All",
            "url": "https://lowervibemusic.web.app/",
            "description": "Stream independent music from Malawi, Nigeria, and across Africa. Discover new artists, save tracks offline, and support creators directly."
          }
        ]
      }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans (Display & UI) + JetBrains Mono (Timecodes & BPM) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-first-paint theme script: prevents any flash between Light / Dark / System -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('lowervibe_theme_mode_v3') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          var metaTheme = document.getElementById('lv-theme-color');
          if (resolved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
            if (metaTheme) metaTheme.setAttribute('content', '#F4F6F2');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#0A0B0A');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[var(--accent)]/30 selection:text-[var(--text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
